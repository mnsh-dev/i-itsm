<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="">
<head><meta charset="UTF-8"><title>Incidents</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<main>
  <div th:replace="~{fragments :: flash}"></div>
  <h2>Incidents</h2>
  <form method="get" th:action="@{/ui/incidents}" class="filters">
    <select name="status" aria-label="Status"><option value="">Any status</option>
      <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s == status}"></option></select>
    <select name="priority" aria-label="Priority"><option value="">Any priority</option>
      <option th:each="p : ${priorities}" th:value="${p}" th:text="${p}" th:selected="${p == priority}"></option></select>
    <select name="categoryId" aria-label="Category"><option value="">Any category</option>
      <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${c.id == categoryId}"></option></select>
    <select name="serviceId" aria-label="Service"><option value="">Any service</option>
      <option th:each="s : ${services}" th:value="${s.id}" th:text="${s.name}" th:selected="${s.id == serviceId}"></option></select>
    <select name="slaStatus" aria-label="SLA status"><option value="">Any SLA status</option>
      <option th:each="s : ${slaStatuses}" th:value="${s}" th:text="${s}" th:selected="${s == slaStatus}"></option></select>
    <select name="technicianId" aria-label="Technician" th:if="${isAdmin or !isStaff}">
      <option value="">Any technician</option>
      <option th:each="t : ${technicians}" th:value="${t.id}" th:text="${t.name}" th:selected="${t.id == technicianId}"></option>
    </select>
    <input type="date" name="fromDate" aria-label="Created on or after" title="Created on or after" th:value="${fromDate}">
    <input type="text" name="text" placeholder="Search ID or keyword" aria-label="Search ID or keyword" th:value="${text}">
    <label th:if="${isTechnician}"><input type="checkbox" name="mine" value="true" th:checked="${mine}"> My assigned</label>
    <button type="submit">Filter</button>
  </form>
  <table>
    <tr><th>ID</th><th>Description</th><th>Service</th><th>Priority</th><th>Status</th><th>Technician</th><th>SLA</th><th>Created</th></tr>
    <tr th:each="i : ${incidents}">
      <td><a th:href="@{/ui/incidents/{id}(id=${i.id})}" th:text="${'INC' + i.id}"></a></td>
      <td th:text="${i.description}"></td>
      <td th:text="${i.service.name}"></td>
      <td><span class="badge" th:classappend="'p-' + ${i.priority}" th:text="${i.priority}"></span></td>
      <td th:text="${i.status}"></td>
      <td th:text="${i.assignedTo?.name ?: '-'}"></td>
      <td><span class="badge" th:classappend="'sla-' + ${i.slaStatus}" th:text="${i.slaStatus}"></span></td>
      <td th:text="${#temporals.format(i.createdAt, 'dd MMM HH:mm')}"></td>
    </tr>
    <tr th:if="${#lists.isEmpty(incidents)}"><td colspan="8">No incidents found.</td></tr>
  </table>
</main>
</body>
</html>
